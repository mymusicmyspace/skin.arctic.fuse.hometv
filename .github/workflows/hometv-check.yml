name: Check Home TV
on:
  push:
    branches: [home-tv, 'updates/**']
  pull_request:
    branches: [home-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test merge and release protection
        run: python -m unittest discover -s .hometv/tests -v
      - name: Build candidate package
        run: python .hometv/maintain.py build
      - uses: actions/upload-artifact@v4
        with:
          name: hometv-candidate
          path: dist/*
          if-no-files-found: error
